{% extends "admin/base.html" %}
{% block title %}Upload formularza{% endblock %}
{% block content %}
<div class="admin-page-title">
    <div>
        <p class="admin-eyebrow">Formularze</p>
        <h1>Wgraj formularz</h1>
    </div>
    <a class="admin-button-secondary" href="{{ url_for('admin.forms_list') }}">Powrot</a>
</div>
<div class="admin-card">
    <form method="post" enctype="multipart/form-data" class="admin-form">
        <input type="hidden" name="csrf_token" value="{{ admin_csrf_token() }}">
        <div class="admin-form-grid">
            <label>
                <span>Plik formularza</span>
                <input type="file" name="form_file" accept="application/json,.json,text/html,.html,.docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" required>
                <small>Obslugiwane formaty: JSON, HTML, DOCX.</small>
            </label>
            <label>
                <span>Nazwa formularza</span>
                <input type="text" name="name" placeholder="np. Formularz rekrutacyjny">
            </label>
            <label>
                <span>Slug</span>
                <input type="text" name="slug" placeholder="np. formularz_rekrutacyjny">
            </label>
            <label>
                <span>Kolejnosc sortowania</span>
                <input type="number" name="sort_order" value="0">
            </label>
            <label>
                <span>Etykieta projektu</span>
                <input type="text" name="label_text" placeholder="np. PROJEKT 6.08">
            </label>
            <label>
                <span>Kolor tekstu etykiety</span>
                <input type="text" name="label_color" value="#b38d45">
            </label>
            <label>
                <span>Tlo etykiety</span>
                <input type="text" name="label_background" value="#f7f3ec">
            </label>
            <label class="admin-check">
                <input type="checkbox" name="is_active" checked>
                <span>Aktywny po wgraniu</span>
            </label>
            <label class="admin-check">
                <input type="checkbox" name="is_public" checked>
                <span>Widoczny publicznie</span>
            </label>
        </div>
        <div class="admin-section">
            <h2>Integracja poczty</h2>
            <div class="admin-form-grid">
                <label><span>Sposób wysyłki</span><select name="mail_mode" data-mail-mode><option value="system">Użyj domyślnej poczty systemowej</option><option value="custom">Użyj indywidualnej poczty dla tego formularza</option><option value="disabled">Nie wysyłaj maili dla tego formularza</option></select></label>
            </div>
            <div class="admin-form-grid" data-custom-smtp hidden>
                <label><span>SMTP host</span><input name="form_smtp_host"></label>
                <label><span>SMTP port</span><input type="number" min="1" max="65535" name="form_smtp_port" value="587"></label>
                <label><span>Użytkownik SMTP</span><input name="form_smtp_user" autocomplete="off"></label>
                <label><span>Hasło SMTP</span><input type="password" name="form_smtp_password" autocomplete="new-password"></label>
                <label><span>Nadawca e-mail</span><input type="email" name="form_smtp_mail_from"></label>
                <label><span>Nazwa nadawcy</span><input name="form_smtp_sender_name"></label>
                <label><span>Reply-To</span><input type="email" name="form_smtp_reply_to"></label>
                <label><span>Timeout (s)</span><input type="number" min="1" max="120" name="form_smtp_timeout" value="30"></label>
                <label class="admin-check"><input type="checkbox" name="form_smtp_use_tls" checked><span>TLS/STARTTLS</span></label>
                <label class="admin-check"><input type="checkbox" name="form_smtp_use_ssl"><span>SSL</span></label>
            </div>
        </div>
        <div class="admin-form-actions">
            <a class="admin-button-secondary" href="{{ url_for('admin.forms_list') }}">Anuluj</a>
            <button class="admin-button" type="submit">Wgraj i wykryj pola</button>
        </div>
    </form>
</div>
<script>
const mailMode = document.querySelector("[data-mail-mode]");
const customSmtp = document.querySelector("[data-custom-smtp]");
function syncMailSettingsVisibility() { if (customSmtp) customSmtp.hidden = mailMode?.value !== "custom"; }
mailMode?.addEventListener("change", syncMailSettingsVisibility);
syncMailSettingsVisibility();
</script>
{% endblock %}
