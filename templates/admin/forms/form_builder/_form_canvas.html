<main class="form-builder__canvas-panel">
    <div class="form-builder__canvas-heading">
        <div>
            <span class="admin-eyebrow">Obszar formularza</span>
            <h3>{{ form.title or form.name }}</h3>
        </div>
        <span data-field-count></span>
    </div>
    <div class="form-builder__canvas" data-form-canvas aria-label="Układ pól formularza"></div>
    <div class="form-builder__empty" data-builder-empty>
        <strong>Formularz nie ma jeszcze pól</strong>
        <span>Dodaj pierwsze pole z biblioteki po lewej stronie.</span>
    </div>
</main>
