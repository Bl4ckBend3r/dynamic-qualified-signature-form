{% extends "admin/base.html" %}
{% block title %}Układ wiadomości{% endblock %}

{% block content %}

<div class="admin-page-title">
  <div>
    <h1>Układ wiadomości</h1>
    <p>Globalne ustawienia wyglądu e-maili.</p>
  </div>
</div>

<form method="post" class="admin-card admin-form">
  <input type="hidden"
         name="csrf_token"
         value="{{ admin_csrf_token() }}">

  <div class="admin-form-grid">

    <label>
      <span>Nazwa platformy</span>
      <input name="layout_platform_name"
             value="{{ layout.platform_name }}">
    </label>

    <label>
      <span>Kolor główny</span>
      <input type="color"
             name="layout_primary_color"
             value="{{ layout.primary_color }}">
    </label>

    <label>
      <span>Kolor akcentu</span>
      <input type="color"
             name="layout_accent_color"
             value="{{ layout.accent_color }}">
    </label>

    <label>
      <span>Tło wiadomości</span>
      <input type="color"
             name="layout_body_background"
             value="{{ layout.body_background | default('#f0f1f5') }}">
    </label>

    <label>
      <span>Tło karty</span>
      <input type="color"
             name="layout_card_background"
             value="{{ layout.card_background | default('#ffffff') }}">
    </label>

    <label>
      <span>Tło bloku treści</span>
      <input type="color"
             name="layout_light_panel_background"
             value="{{ layout.light_panel_background | default('#f7f3ec') }}">
    </label>

    <label>
      <span>Logo</span>
      <select name="layout_logo_id">
        <option value="">Bez logo</option>
        {% for logo in logos %}
        <option value="{{ logo.id }}"
          {% if layout.logo_id == logo.id %}selected{% endif %}>
          {{ logo.name }}
        </option>
        {% endfor %}
      </select>
    </label>

    <label>
      <span>Położenie logo</span>
      <select name="layout_logo_position">
        {% for value, label in [
          ('none', 'Brak'),
          ('header', 'Nagłówek'),
          ('before_content', 'Przed treścią'),
          ('after_content', 'Po treści')
        ] %}
        <option value="{{ value }}"
          {% if layout.logo_position == value %}selected{% endif %}>
          {{ label }}
        </option>
        {% endfor %}
      </select>
    </label>

    <label>
      <span>Wyrównanie logo</span>
      <select name="layout_logo_alignment">
        {% for value, label in [
          ('left', 'Do lewej'),
          ('center', 'Do środka'),
          ('right', 'Do prawej')
        ] %}
        <option value="{{ value }}"
          {% if layout.logo_alignment == value %}selected{% endif %}>
          {{ label }}
        </option>
        {% endfor %}
      </select>
    </label>

    <label>
      <span>Wysokość logo (px)</span>
      <input type="number"
             min="16" max="200"
             name="layout_logo_height_px"
             value="{{ layout.logo_height_px }}">
    </label>

  </div>

  <div class="admin-form-actions">
    <button type="submit" class="admin-button">
      Zapisz układ
    </button>
  </div>
</form>

<section class="admin-card" style="margin-top:24px;">
  <h2>Podgląd zapisanego układu</h2>
  <iframe
    title="Podgląd wiadomości"
    sandbox
    srcdoc="{{ preview_html }}"
    style="width:100%;height:620px;border:0;background:white;">
  </iframe>
</section>

{% endblock %}
