{% set q = question if question is defined else none %}<div class="training-question-card" data-training-question><div class="training-question-card__heading"><h3>Pytanie <span data-question-number>1</span></h3><button class="admin-link-button admin-link-danger" type="button" data-remove-question>Usuń pytanie</button></div><label><span>Treść *</span><input name="question_text" required value="{{ q.text if q else '' }}"></label><label><span>Typ</span><select name="question_type"><option value="single_choice" {% if q and q.question_type == 'single_choice' %}selected{% endif %}>Jednokrotny wybór</option><option value="multiple_choice" {% if q and q.question_type == 'multiple_choice' %}selected{% endif %}>Wielokrotny wybór (dokładny zestaw)</option><option value="true_false" {% if q and q.question_type == 'true_false' %}selected{% endif %}>Prawda / fałsz</option><option value="text" {% if q and q.question_type == 'text' %}selected{% endif %}>Tekst (bez punktów)</option></select></label><label class="training-field-wide"><span>Opcje, po jednej w wierszu</span><textarea name="question_options" rows="4" placeholder="A&#10;B&#10;C">{{ (q.options_json or [])|join('\n') if q else '' }}</textarea></label><label class="training-field-wide"><span>Poprawne odpowiedzi, po jednej w wierszu</span><textarea name="question_correct_answers" rows="3" placeholder="Dla Prawda/Fałsz wpisz: true albo false">{{ (q.correct_answers_json or [])|join('\n') if q else '' }}</textarea></label><label><span>Punkty</span><input type="number" name="question_points" min="0" step="0.01" value="{{ q.points if q else 1 }}"></label><label><span>Klucz porównawczy (opcjonalnie)</span><input name="question_comparison_key" maxlength="128" pattern="[A-Za-z0-9_.-]*" value="{{ q.comparison_key if q else '' }}"></label></div>
